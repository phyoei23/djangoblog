{% extends "blog/base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}

<h1>{{ post.title }}</h1>

<p class="text-muted">
    {{ post.created_at|date:"M d, Y" }}
</p>

<p>
    {{ post.content }}
</p>

{% if post.tags.all %}
    <div class="post-tags mt-4">
        <strong>Tags:</strong>
        {% for tag in post.tags.all %}
            <span class="badge bg-secondary me-1">{{ tag.name }}</span>
        {% endfor %}
    </div>
{% endif %}


{% endblock %}
